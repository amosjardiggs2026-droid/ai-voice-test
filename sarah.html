<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarah AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:flex;flex-direction:column;background:#0f1b33;color:#fff;font-family:sans-serif}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.4;white-space:pre-wrap}
.u{align-self:flex-end;background:#f5b333;color:#1a1a1a}
.s{align-self:flex-start;background:#1c2a4a}
#st{font-size:12px;color:#9fb0d0;padding:0 16px 6px;min-height:20px}
#bar{display:flex;gap:8px;padding:12px;background:#16233f;align-items:center}
#q{flex:1;padding:12px 16px;border-radius:24px;border:1px solid #2c3d63;background:#1c2a4a;color:#fff;font-size:16px;outline:none}
button{border:0;border-radius:50%;width:46px;height:46px;font-size:20px;cursor:pointer}
#mic,#spk{background:#2c3d63;color:#fff}
#mic.on{background:#e5484d}
#send{background:#f5b333;color:#1a1a1a}
</style>
</head>
<body>
<div id="chat"></div>
<div id="st"></div>
<div id="bar">
  <input id="q" placeholder="Ask Sarah anything" autocomplete="off">
  <button id="spk" title="Read answers aloud">🔊</button>
  <button id="mic" title="Speak">🎤</button>
  <button id="send" title="Send">↑</button>
</div>
<script>
var API = "https://script.google.com/macros/s/AKfycbwdVMu1S09SCiLfGuRbagysR5Nc167Yf4mIqqfXIalhekXw4ZNYG3Oo1u_E6att__4D/exec";
var chat = document.getElementById("chat");
var q = document.getElementById("q");
var st = document.getElementById("st");
var mic = document.getElementById("mic");
var spk = document.getElementById("spk");
var speakOn = true;
var hasTTS = "speechSynthesis" in window;

function add(text, cls) {
  var d = document.createElement("div");
  d.className = "m " + cls;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function speak(t) {
  if (!speakOn || !hasTTS) return;
  window.speechSynthesis.cancel();
  var clean = String(t).replace(/[*#_`>]/g, "").replace(/\s+/g, " ");
  var u = new SpeechSynthesisUtterance(clean);
  u.lang = "en-US";
  window.speechSynthesis.speak(u);
}

spk.onclick = function () {
  speakOn = !speakOn;
  spk.textContent = speakOn ? "🔊" : "🔇";
  if (!speakOn && hasTTS) window.speechSynthesis.cancel();
};

async function ask(text) {
  text = (text || "").trim();
  if (!text) return;
  if (hasTTS) window.speechSynthesis.cancel();
  q.value = "";
  st.textContent = "";
  add(text, "u");
  var w = add("Sarah is thinking...", "s");
  try {
    var r = await fetch(API, {
      method: "POST",
      body: JSON.stringify({ action: "text", question: text, role: "student", history: [] })
    });
    var data = await r.json();
    if (data.answer) {
      w.textContent = data.answer;
      speak(data.answer);
    } else {
      w.textContent = "No answer received.";
    }
  } catch (e) {
    w.textContent = "I cannot reach Sarah's server. Check that the deployment access is set to Anyone.";
  }
}

document.getElementById("send").onclick = function () { ask(q.value); };
q.addEventListener("keydown", function (e) { if (e.key === "Enter") ask(q.value); });

var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec = null, listening = false, hadErr = false;
if (!SR) {
  mic.style.display = "none";
  st.textContent = "Voice is not supported in this browser. Please use Chrome.";
} else {
  rec = new SR();
  rec.lang = "en-US";
  rec.interimResults = true;
  rec.onstart = function () {
    listening = true; hadErr = false;
    mic.classList.add("on");
    st.textContent = "Listening... speak now";
  };
  rec.onresult = function (e) {
    var t = "";
    for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    q.value = t;
  };
  rec.onerror = function (e) { hadErr = true; st.textContent = "Microphone error: " + e.error; };
  rec.onend = function () {
    listening = false;
    mic.classList.remove("on");
    if (!hadErr) st.textContent = q.value.trim() ? "Tap the yellow arrow to send." : "";
  };
  mic.onclick = function () {
    if (listening) { rec.stop(); return; }
    if (hasTTS) window.speechSynthesis.cancel();
    try { rec.start(); } catch (e) {}
  };
}

add("Hello, I am Sarah. Type your question, or tap the microphone and speak. Then tap the yellow arrow to send.", "s");
</script>
</body>
</html>
